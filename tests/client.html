<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Bragi Browser tests</title></head>
<body>
<h1>Bragi Browser tests</h1>
<pre id="result">Running…</pre>
<iframe title="Test client" src="../index.html" hidden></iframe>
<script>
"use strict";
const result = document.getElementById("result");
const frame = document.querySelector("iframe");
const wait = async predicate => {
  for (let i = 0; i < 100; i++) {
    if (predicate()) return;
    await new Promise(resolve => setTimeout(resolve, 10));
  }
  throw new Error("Timed out waiting for the client.");
};
const check = (condition, text) => { if (!condition) throw new Error(text); };

frame.addEventListener("load", async () => {
  const w = frame.contentWindow;
  const d = frame.contentDocument;
  d.documentElement.style.transition = "none";
  const el = id => d.getElementById(id);
  const serverUrlKey = "bragi.serverUrl";
  const usernameKey = "bragi.username";
  const autoShuffleKey = "bragi.autoShuffle";
  const visualizerKey = "bragi.visualizer";
  const previousServerUrl = localStorage.getItem(serverUrlKey);
  const previousUsername = localStorage.getItem(usernameKey);
  const previousAutoShuffle = localStorage.getItem(autoShuffleKey);
  const previousVisualizer = localStorage.getItem(visualizerKey);
  const originalSetItem = w.Storage.prototype.setItem;
  const originalImage = w.Image;
  const originalSetTimeout = w.setTimeout;
  const paletteRequests = [];
  w.Image = function() {
    const image = d.createElement("canvas");
    image.width = image.height = 4;
    image.getContext("2d").fillStyle = "#ff0000";
    image.getContext("2d").fillRect(0, 0, 4, 4);
    Object.defineProperty(image, "src", {set: value => { image.imageUrl = value; paletteRequests.push(image); }});
    return image;
  };
  const videos = [
    {name: "One", link: "https://youtu.be/abcdefghijk", thumbnail_url: "https://artwork.example/cover.png"},
    {name: "Bad", link: "https://youtu.be/12345678901"},
    {name: "One", link: "https://youtu.be/abcdefghijk", thumbnail_url: null}
  ];
  const queue = {id: "q", playlist_id: "p", name: "Mix", shuffled: false, videos};
  let mode = "normal";
  let badAttempts = 0;
  let loads = 0;
  let allowReplace = false;
  let cancelled = false;
  let resolveEntered = false;
  let proxyEntered = false;
  let proxyCancelled = false;
  let lastLoad;
  let finishLoad;
  let finishMediaUpdate;
  let finishLogin;
  let finishCreate;
  let finishAddSong;
  let finishRemoveSong;
  let finishReplaceSong;
  let castBatchSize = 16;
  let currentQueue = queue;
  const createdPlaylists = [];
  const initialPlaylists = [
    {id: "p", name: "Mix", videos: videos.map(video => ({...video, thumbnail_url: "https://artwork.example/playlist.png"}))},
    {id: "empty", name: "Empty", videos: []},
    {id: "other", name: "Other", videos: [videos[0]]}
  ];
  const thumbnailUrl = "https://artwork.example/cover.png";
  const thirdThumbnailUrl = "https://artwork.example/third.png";
  const requests = [];
  w.fetch = async (url, options) => {
    const path = new URL(url).pathname;
    requests.push({url, path, method: options.method, body: options.body, headers: options.headers, redirect: options.redirect, credentials: options.credentials});
    const json = (body, status = 200) => new Response(JSON.stringify(body), {status, headers: {"Content-Type": "application/json"}});
    if (path.endsWith("/playlists")) {
      if (options.method === "POST") {
        if (mode === "playlist-uncertain") throw new TypeError("network failure");
        if (mode === "playlist-invalid") return json({}, 400);
        const playlist = {id: `new-${createdPlaylists.length}`, name: JSON.parse(options.body).name, videos: []};
        if (mode === "playlist-delay") {
          return new Promise(resolve => { finishCreate = () => { createdPlaylists.push(playlist); resolve(json({playlist}, 201)); }; });
        }
        createdPlaylists.push(playlist);
        return json({playlist}, 201);
      }
      if (mode === "invalid") return json({}, 401);
      if (mode === "login-delay") await new Promise(resolve => { finishLogin = resolve; });
      return json({playlists: [...initialPlaylists, ...createdPlaylists]});
    }
    if (path.includes("/playlists/") && path.endsWith("/tracks")) {
      const id = decodeURIComponent(path.split("/").at(-2));
      const collection = initialPlaylists.some(item => item.id === id) ? initialPlaylists : createdPlaylists;
      const index = collection.findIndex(item => item.id === id);
      if (index < 0) return json({}, 404);
      if (options.method === "PATCH") {
        const body = JSON.parse(options.body);
        const current = collection[index].videos.map(video => ({name: video.name, link: video.link}));
        if (JSON.stringify(body.videos) !== JSON.stringify(current)) return json({}, 409);
        if (mode === "song-invalid") return json({}, 400);
        if (mode === "song-title-failed") return json({}, 422);
        const replace = () => {
          const video = {name: "Replacement title", link: body.url, thumbnail_url: "https://artwork.example/replacement.png"};
          collection[index] = {...collection[index], videos: collection[index].videos.map((item, position) => position === body.index ? video : item)};
          return json({playlist: collection[index]});
        };
        if (mode === "replace-delay") return new Promise(resolve => { finishReplaceSong = () => resolve(replace()); });
        if (mode === "replace-uncertain") { replace(); throw new TypeError("network failure"); }
        if (mode === "replace-malformed") { replace(); return json({playlist: {id, name: "Other", videos: [null]}}); }
        return replace();
      }
      if (options.method === "DELETE") {
        const body = JSON.parse(options.body);
        const current = collection[index].videos.map(video => ({name: video.name, link: video.link}));
        if (JSON.stringify(body.videos) !== JSON.stringify(current)) return json({}, 409);
        const remove = () => {
          collection[index] = {...collection[index], videos: collection[index].videos.filter((_, position) => position !== body.index)};
          return json({playlist: collection[index]});
        };
        if (mode === "remove-delay") return new Promise(resolve => { finishRemoveSong = () => resolve(remove()); });
        if (mode === "remove-uncertain") { remove(); throw new TypeError("network failure"); }
        return remove();
      }
      if (mode === "song-invalid") return json({}, 400);
      if (mode === "song-title-failed") return json({}, 422);
      if (mode === "song-full") return json({}, 409);
      const add = () => {
        const video = {name: "Fetched title", link: JSON.parse(options.body).url, thumbnail_url: "https://artwork.example/song.png"};
        collection[index] = {...collection[index], videos: [...collection[index].videos, video]};
        return json({playlist: collection[index]}, 201);
      };
      if (mode === "song-delay") return new Promise(resolve => { finishAddSong = () => resolve(add()); });
      if (mode === "song-uncertain") { add(); throw new TypeError("network failure"); }
      if (mode === "song-malformed") { add(); return json({playlist: {id, name: "Other", videos: [null]}}, 201); }
      return add();
    }
    if (path.includes("/playlists/")) {
      const id = decodeURIComponent(path.split("/").pop());
      const collection = initialPlaylists.some(item => item.id === id) ? initialPlaylists : createdPlaylists;
      const index = collection.findIndex(item => item.id === id);
      if (index < 0) return json({}, 404);
      if (mode === "playlist-invalid") return json({}, 400);
      if (options.method === "PATCH") {
        collection[index] = {...collection[index], name: JSON.parse(options.body).name};
        if (mode === "playlist-uncertain") throw new TypeError("network failure");
        return json({playlist: collection[index]});
      }
      if (options.method === "DELETE") {
        collection.splice(index, 1);
        if (mode === "playlist-uncertain") throw new TypeError("network failure");
        return new Response(null, {status: 204});
      }
    }
    if (path.endsWith("/queue")) {
      if (mode === "uncertain" && options.method === "POST") throw new TypeError("network failure");
      if (options.method === "POST") {
        const shuffled = JSON.parse(options.body).shuffle;
        currentQueue = mode === "tail-bad"
          ? {...queue, id: "tail-bad", videos: [videos[0], videos[2], videos[1]]}
          : shuffled
            ? {...queue, id: "shuffled", shuffled: true, videos: [videos[1], videos[0], videos[2]]}
            : queue;
      }
      return json({queue: currentQueue}, options.method === "POST" ? 201 : 200);
    }
    if (path.endsWith("/cast-queue")) {
      if (mode === "delay") {
        resolveEntered = true;
        return new Promise((resolve, reject) => options.signal.addEventListener("abort", () => {
          cancelled = true;
          reject(new DOMException("Aborted", "AbortError"));
        }));
      }
      return json({token: "A".repeat(43), expires_in: 604800, batch_size: castBatchSize});
    }
    if (path.endsWith("/resolve")) {
      if (mode === "delay") {
        resolveEntered = true;
        return new Promise((resolve, reject) => options.signal.addEventListener("abort", () => {
          cancelled = true;
          reject(new DOMException("Aborted", "AbortError"));
        }));
      }
      if (JSON.parse(options.body).url.endsWith("12345678901")) {
        badAttempts++;
        return json({}, 422);
      }
      return json({audio: {url: "https://media.example/signed-secret", title: "One", content_type: "audio/mp4"}});
    }
    if (path.endsWith("/audio-proxy")) {
      if (mode === "proxy-delay") {
        proxyEntered = true;
        return new Promise((resolve, reject) => options.signal.addEventListener("abort", () => {
          proxyCancelled = true;
          reject(new DOMException("Aborted", "AbortError"));
        }));
      }
      if (mode === "proxy-failed") return json({}, 503);
      if (mode === "proxy-auth") return json({}, 401);
      if (mode === "invalid-proxy") return json({proxy_url: "https://evil.example/api/v1/audio-stream?token=proxy-secret", expires_in: 21600});
      return json({proxy_url: "/api/v1/audio-stream?token=proxy-secret", expires_in: 21600});
    }
    throw new Error("Unexpected request");
  };
  const audio = el("audio");
  let localPaused = true;
  let localTime = 0;
  let localError = null;
  let spectrumLevel = 0;
  let lowFrequencyOnly = false;
  let descendingSpectrum = false;
  let captures = 0;
  let stoppedCaptures = 0;
  w.AudioContext = class {
    constructor() { this.state = "running"; this.destination = {}; }
    createMediaStreamSource() { return {connect() {}, disconnect() {}}; }
    createAnalyser() { return {fftSize: 256, frequencyBinCount: 128, connect() {}, disconnect() {},
      getByteFrequencyData(data) {
        data.fill(lowFrequencyOnly || descendingSpectrum ? 0 : spectrumLevel);
        if (lowFrequencyOnly || descendingSpectrum) {
          for (let i = 0; i < 4; i++) data[i] = descendingSpectrum ? spectrumLevel * (4 - i) / 4 : spectrumLevel;
        }
      }}; }
    createGain() { return {gain: {value: 1}, connect() {}, disconnect() {}}; }
    resume() { this.state = "running"; return Promise.resolve(); }
  };
  audio.captureStream = () => {
    captures++;
    const track = {stop: () => { stoppedCaptures++; }};
    return {getTracks: () => [track], getAudioTracks: () => [track]};
  };
  Object.defineProperty(audio, "paused", {get: () => localPaused});
  Object.defineProperty(audio, "duration", {get: () => 180});
  Object.defineProperty(audio, "currentTime", {get: () => localTime, set: value => { localTime = value; }});
  Object.defineProperty(audio, "error", {get: () => localError});
  Object.defineProperty(audio, "readyState", {get: () => 2});
  w.HTMLMediaElement.prototype.play = function() { localPaused = false; this.dispatchEvent(new w.Event("play")); this.dispatchEvent(new w.Event("playing")); return Promise.resolve(); };
  w.HTMLMediaElement.prototype.pause = function() { localPaused = true; this.dispatchEvent(new w.Event("pause")); };
  w.HTMLMediaElement.prototype.load = () => {};
  try {
    const sample = d.createElement("canvas");
    sample.width = sample.height = 10;
    const sampleContext = sample.getContext("2d");
    sampleContext.fillStyle = "#ff0000";
    sampleContext.fillRect(0, 0, 8, 10);
    sampleContext.fillStyle = "#0000ff";
    sampleContext.fillRect(8, 0, 2, 10);
    check(w.eval("artworkAccent")(sample) === "hsl(0 55% 80%)", "Accent did not follow the dominant artwork color.");
    sampleContext.fillStyle = "#808080";
    sampleContext.fillRect(0, 0, 10, 10);
    check(w.eval("artworkAccent")(sample) === "hsl(0 0% 80%)", "Grayscale artwork did not produce a neutral accent.");
    localStorage.removeItem(serverUrlKey);
    localStorage.removeItem(usernameKey);
    localStorage.removeItem(autoShuffleKey);
    localStorage.removeItem(visualizerKey);
    const defaultFrame = document.createElement("iframe");
    defaultFrame.hidden = true;
    defaultFrame.src = "../index.html";
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("Timed out loading a fresh client.")), 5000);
      defaultFrame.addEventListener("load", () => { clearTimeout(timer); resolve(); }, {once: true});
      document.body.append(defaultFrame);
    });
    check(!defaultFrame.contentDocument.getElementById("auto-shuffle").checked, "Auto shuffle should default to off.");
    check(defaultFrame.contentDocument.getElementById("visualizer-mode").value === "bars", "The visualizer should default to spectrum bars.");
    check(!defaultFrame.contentDocument.getElementById("server").readOnly &&
      !defaultFrame.contentDocument.getElementById("username").readOnly, "Unsaved connection fields should be editable.");
    defaultFrame.remove();
    el("open-settings").click();
    check(!el("settings-panel").hidden && el("login-panel").hidden, "Settings did not open from the login page.");
    el("visualizer-mode").value = "wave";
    el("visualizer-mode").dispatchEvent(new w.Event("change"));
    check(localStorage.getItem(visualizerKey) === "wave", "Visualizer mode was not saved.");
    el("auto-shuffle").checked = true;
    el("auto-shuffle").dispatchEvent(new w.Event("change"));
    check(localStorage.getItem(autoShuffleKey) === "true", "Auto shuffle was not saved.");
    el("close-settings").click();
    check(!el("login-panel").hidden && el("settings-panel").hidden, "Settings did not return to login.");
    localStorage.setItem(serverUrlKey, "http://old.example");
    const legacyFrame = document.createElement("iframe");
    legacyFrame.hidden = true;
    legacyFrame.src = "../index.html";
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("Timed out loading a fresh client.")), 5000);
      legacyFrame.addEventListener("load", () => { clearTimeout(timer); resolve(); }, {once: true});
      document.body.append(legacyFrame);
    });
    const legacy = legacyFrame.contentDocument;
    check(legacy.getElementById("server").readOnly && !legacy.getElementById("username").readOnly,
      "A previously saved server URL blocked entry of an unsaved username.");
    legacy.getElementById("edit-connection").click();
    check(!legacy.getElementById("server").readOnly && !legacy.getElementById("username").readOnly,
      "Edit did not unlock partially saved connection details.");
    legacyFrame.remove();
    localStorage.setItem(usernameKey, "previous-user");
    el("server").value = "ftp://server.example";
    el("username").value = "alice";
    el("password").value = "secret";
    el("login-form").requestSubmit();
    await wait(() => el("status").textContent.includes("HTTP or HTTPS server URL"));
    check(requests.length === 0, "Unsupported server scheme was contacted.");
    el("server").value = "https://server.example";
    mode = "invalid";
    el("login-form").requestSubmit();
    await wait(() => el("status").textContent.includes("Authentication failed"));
    check(el("library").hidden, "Invalid credentials signed in.");
    check(localStorage.getItem(serverUrlKey) === "http://old.example", "Failed login replaced the saved server URL.");
    check(localStorage.getItem(usernameKey) === "previous-user", "Failed login replaced the saved username.");
    mode = "login-delay";
    el("server").value = "http://server.example:8000";
    el("password").value = "secret";
    el("login-form").requestSubmit();
    await wait(() => typeof finishLogin === "function");
    el("open-settings").click();
    finishLogin();
    await wait(() => !el("signout").hidden);
    check(!el("settings-panel").hidden && el("library").hidden, "Login interrupted the open settings view.");
    el("close-settings").click();
    await wait(() => !el("library").hidden);
    mode = "normal";
    check(localStorage.getItem(serverUrlKey) === "http://server.example:8000", "Successful login did not save the server URL.");
    check(localStorage.getItem(usernameKey) === "alice", "Successful login did not save the username.");
    const reloadFrame = document.createElement("iframe");
    reloadFrame.hidden = true;
    reloadFrame.src = "../index.html";
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("Timed out loading a fresh client.")), 5000);
      reloadFrame.addEventListener("load", () => { clearTimeout(timer); resolve(); }, {once: true});
      document.body.append(reloadFrame);
    });
    check(reloadFrame.contentDocument.getElementById("server").value === "http://server.example:8000", "A fresh client did not prefill the saved server URL.");
    const reloadDoc = reloadFrame.contentDocument;
    check(reloadDoc.getElementById("username").value === "alice" && reloadDoc.getElementById("server").readOnly &&
      reloadDoc.getElementById("username").readOnly, "Saved connection details were not prefilled read-only.");
    check(reloadDoc.getElementById("password").value === "", "A fresh client restored the password.");
    reloadDoc.getElementById("edit-connection").click();
    check(!reloadDoc.getElementById("server").readOnly && !reloadDoc.getElementById("username").readOnly &&
      reloadDoc.getElementById("edit-connection").textContent.includes("Lock"), "Edit did not unlock connection details.");
    reloadDoc.getElementById("username").value = "";
    reloadDoc.getElementById("edit-connection").click();
    check(reloadDoc.getElementById("server").readOnly && reloadDoc.getElementById("username").readOnly &&
      reloadDoc.getElementById("edit-connection").textContent.includes("Edit"), "Lock did not make both fields read-only.");
    reloadDoc.getElementById("password").value = "secret";
    reloadDoc.getElementById("login-form").requestSubmit();
    await wait(() => reloadDoc.getElementById("status").textContent.includes("Enter a username"));
    check(localStorage.getItem(usernameKey) === "alice", "Editing without connecting changed the saved username.");
    check(reloadFrame.contentDocument.getElementById("auto-shuffle").checked, "A fresh client did not restore auto shuffle.");
    check(reloadFrame.contentDocument.getElementById("visualizer-mode").value === "wave", "A fresh client did not restore the visualizer.");
    reloadFrame.remove();
    el("open-settings").click();
    check(!el("settings-panel").hidden && el("library").hidden, "Settings did not open from the library.");
    el("auto-shuffle").checked = false;
    el("auto-shuffle").dispatchEvent(new w.Event("change"));
    check(localStorage.getItem(autoShuffleKey) === "false", "Disabling auto shuffle was not saved.");
    el("visualizer-mode").value = "bars";
    el("visualizer-mode").dispatchEvent(new w.Event("change"));
    el("close-settings").click();
    check(!el("library").hidden && el("settings-panel").hidden, "Settings did not return to the library.");
    const disabledFrame = document.createElement("iframe");
    disabledFrame.hidden = true;
    disabledFrame.src = "../index.html";
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("Timed out loading a fresh client.")), 5000);
      disabledFrame.addEventListener("load", () => { clearTimeout(timer); resolve(); }, {once: true});
      document.body.append(disabledFrame);
    });
    check(!disabledFrame.contentDocument.getElementById("auto-shuffle").checked, "A fresh client did not restore disabled auto shuffle.");
    disabledFrame.remove();
    check(requests.some(r => r.url === "http://server.example:8000/api/v1/playlists"), "HTTP server was not contacted.");
    check(requests.some(r => r.url === "https://server.example/api/v1/playlists"), "HTTPS server was not contacted.");
    check(el("password").value === "", "Password was not cleared.");
    check(!d.querySelector(".account-bar").textContent.includes("Signed in as"), "The header still displays the account name.");
    check(!el("cancel"), "The removed preparation button is still present.");
    check(d.querySelectorAll(".playlist-button").length === 3, "Playlist list was not rendered.");
    check(el("play-selected").closest(".sidebar"), "Play playlist was not placed in the playlist sidebar.");
    el("toggle-sidebar").querySelector("img").click();
    check(el("playlist-sidebar").hidden && el("library").classList.contains("sidebar-hidden") &&
      el("toggle-sidebar").getAttribute("aria-expanded") === "false", "Logo did not hide the playlist sidebar.");
    el("toggle-sidebar").querySelector("span").click();
    check(!el("playlist-sidebar").hidden && !el("library").classList.contains("sidebar-hidden") &&
      el("toggle-sidebar").getAttribute("aria-expanded") === "true", "Bragi name did not restore the playlist sidebar.");
    check(!el("track-search").disabled, "Search was disabled before choosing a playlist.");
    el("track-search").value = "one";
    el("track-search").dispatchEvent(new w.Event("input", {bubbles: true}));
    check(el("tracks-empty").textContent.includes("Choose a playlist"), "Searching without a playlist showed the wrong message.");
    d.querySelectorAll(".playlist-button")[1].click();
    check(el("play-selected").disabled, "Empty playlist should not be playable.");
    check(el("tracks-empty").textContent.includes("no tracks"), "Empty playlist was not displayed.");
    check(el("playlist-title").textContent === "Empty - (0 songs)", "Empty playlist count was not displayed.");
    d.querySelector(".playlist-button").click();
    check(d.querySelectorAll("#tracks li").length === 3, "Selected playlist tracks were not displayed.");
    const numberedTrack = d.querySelector(".track-button");
    const previousNumber = numberedTrack.dataset.trackNumber;
    numberedTrack.dataset.trackNumber = "99999";
    const numberStyle = w.getComputedStyle(numberedTrack, "::before");
    const numberCanvas = d.createElement("canvas").getContext("2d");
    numberCanvas.font = numberStyle.font;
    check(numberStyle.whiteSpace === "nowrap" && parseFloat(numberStyle.width) >= numberCanvas.measureText("99999").width,
      "Five-digit track numbers do not fit in their column.");
    numberedTrack.dataset.trackNumber = previousNumber;
    check([...d.querySelectorAll("#tracks li")].filter(item => !item.hidden).length === 2,
      "A search entered before selecting a playlist was not applied.");
    check(el("playlist-title").textContent === "Mix - (3 songs)", "Playlist count was not displayed.");
    check(!requests.some(r => r.path.endsWith("/queue")), "Selecting a playlist unexpectedly created a queue.");
    const searchTracks = value => {
      el("track-search").value = value;
      el("track-search").dispatchEvent(new w.Event("input", {bubbles: true}));
    };
    const visibleTracks = () => [...d.querySelectorAll("#tracks li")].filter(item => !item.hidden);
    searchTracks("  bAd  ");
    check(visibleTracks().length === 1 && visibleTracks()[0].textContent.includes("Bad") &&
      visibleTracks()[0].querySelector(".track-button").dataset.trackNumber === "2",
      "Search did not filter case-insensitively or preserve the original track number.");
    check(el("playlist-title").textContent === "Mix - (3 songs)", "Searching changed the total song count.");
    searchTracks("missing");
    check(!visibleTracks().length && el("tracks-empty").textContent.includes("No songs match"),
      "A search with no matches did not show an empty result.");
    d.querySelectorAll(".playlist-button")[1].click();
    check(el("tracks-empty").textContent.includes("no tracks"), "Searching an empty playlist showed the wrong message.");
    d.querySelector(".playlist-button").click();
    searchTracks("");
    check(visibleTracks().length === 3 && el("tracks-empty").hidden, "Clearing search did not restore all songs.");

    el("play-selected").click();
    await wait(() => el("queue-status").textContent.includes("(1 of 3)"));
    await wait(() => !el("play-selected").disabled);
    check(el("playlist-title").textContent === "Mix - (3 songs)" &&
      d.querySelectorAll(".edit-song").length === 3 && !d.querySelector(".edit-song").disabled,
      "Starting browser playback did not keep the saved playlist editable.");
    frame.hidden = false;
    const trackList = el("tracks");
    const originalMaxHeight = trackList.style.maxHeight;
    const originalMatchMedia = w.matchMedia;
    trackList.style.maxHeight = "70px";
    w.matchMedia = query => query === "(prefers-reduced-motion: reduce)" ? {matches: true} : originalMatchMedia.call(w, query);
    w.eval("state.localPlayingIndex = 1; updatePlayer()");
    const centered = d.querySelectorAll(".track-button")[1].getBoundingClientRect();
    const listBounds = trackList.getBoundingClientRect();
    check(Math.abs((centered.top + centered.bottom) / 2 - (listBounds.top + listBounds.bottom) / 2) <= 1,
      "The current track was not centered in the track list.");
    let resumeScroll, pauseDelay, pendingTimer;
    const originalClearTimeout = w.clearTimeout;
    const cancelledTimers = [];
    w.clearTimeout = id => { cancelledTimers.push(id); originalClearTimeout(id); };
    w.setTimeout = (callback, delay, ...args) => {
      if (delay === 5000) {
        resumeScroll = callback;
        pauseDelay = delay;
        pendingTimer = originalSetTimeout(() => {}, 60000);
        return pendingTimer;
      }
      return originalSetTimeout(callback, delay, ...args);
    };
    trackList.dispatchEvent(new w.WheelEvent("wheel", {bubbles: true, deltaY: 10}));
    trackList.scrollTop = 0;
    w.eval("state.localPlayingIndex = 2; updatePlayer(); updatePlayer()");
    check(pauseDelay === 5000 && trackList.scrollTop === 0,
      "A track change or repeated player update interrupted manual scrolling.");
    const firstTimer = pendingTimer;
    trackList.dispatchEvent(new w.Event("touchmove", {bubbles: true}));
    check(pendingTimer !== firstTimer && cancelledTimers.includes(firstTimer), "Further manual scrolling did not restart the wait.");
    const touchTimer = pendingTimer;
    trackList.dispatchEvent(new w.Event("pointerdown", {bubbles: true}));

    mode = "playlist-uncertain";
    el("edit-playlist").click();
    el("playlist-name").value = "Recovered";
    el("playlist-form").requestSubmit();
    await wait(() => el("status").textContent.includes("rename outcome is uncertain"));
    check(d.querySelector(".playlist-button").textContent === "Recovered" && el("playlist-title").textContent === "Recovered - (0 songs)",
      "An uncertain rename was not reconciled.");
    mode = "playlist-invalid";
    el("edit-playlist").click();
    el("playlist-name").value = "Rejected rename";
    el("playlist-form").requestSubmit();
    await wait(() => !el("playlist-error").hidden);
    check(el("playlist-dialog").open && d.querySelector(".playlist-button").textContent === "Recovered",
      "A failed rename did not preserve the playlist.");
    el("playlist-delete").click();
    await wait(() => !el("playlist-error").hidden);
    check(el("playlist-dialog").open && d.querySelector(".playlist-button").textContent === "Recovered",
      "A failed deletion did not preserve the playlist.");
    mode = "playlist-uncertain";
    el("playlist-delete").click();
    await wait(() => el("status").textContent.includes("deletion outcome is uncertain"));
    check(el("edit-playlist").disabled && el("playlist-title").textContent === "No playlist selected" &&
      !localPaused && audio.src === playingSource, "An uncertain deletion was not reconciled safely.");
    check(el("add-song").disabled, "Adding a song was enabled without a selected playlist.");
    d.querySelector(".playlist-button").click();
    mode = "song-invalid";
    el("add-song").click();
    check(el("song-dialog").open, "Add song dialog did not open.");
    el("song-url").value = "https://evil.example/12345678901";
    el("song-form").requestSubmit();
    await wait(() => !el("song-error").hidden);
    check(el("song-error").textContent.includes("valid HTTPS YouTube"), "Invalid URL was not reported.");
    mode = "song-title-failed";
    el("song-url").value = "https://youtu.be/12345678901";
    el("song-form").requestSubmit();
    await wait(() => !el("song-error").hidden);
    check(el("song-error").textContent.includes("title"), "Title lookup failure was not reported.");
    mode = "song-full";
    el("song-form").requestSubmit();
    await wait(() => !el("song-error").hidden);
    check(el("song-error").textContent.includes("5,000"), "The playlist limit was not reported.");
    mode = "song-delay";
    el("song-form").requestSubmit();
    await wait(() => typeof finishAddSong === "function");
    const songEscape = new w.Event("cancel", {cancelable: true});
    el("song-dialog").dispatchEvent(songEscape);
    check(el("song-save").disabled && el("song-cancel").disabled && songEscape.defaultPrevented,
      "A pending add allowed cancellation or a duplicate submission.");
    finishAddSong();
    await wait(() => !el("song-dialog").open);
    check(d.querySelectorAll("#tracks li").length === 2 && d.querySelector("#tracks").textContent.includes("Fetched title") &&
      el("playlist-title").textContent === "Other - (2 songs)" &&
      el("status").textContent === "" &&
      !localPaused && audio.src === playingSource && requests.filter(r => r.path.endsWith("/queue")).length === queueRequests,
      "Adding a song did not update the playlist silently or changed playback.");
    const songRequests = () => requests.filter(r => r.path.endsWith("/playlists/other/tracks"));
    check(songRequests().length === 4 && JSON.parse(songRequests()[3].body).url === "https://youtu.be/12345678901",
      "The add-song request was not sent correctly.");
    mode = "song-uncertain";
    el("add-song").click();
    el("song-url").value = "https://youtu.be/12345678901";
    el("song-form").requestSubmit();
    await wait(() => el("status").textContent.includes("may still complete"));
    check(!el("song-dialog").open && d.querySelectorAll("#tracks li").length === 3 && songRequests().length === 5,
      "An uncertain add was retried or not reconciled.");
    mode = "song-malformed";
    el("add-song").click();
    el("song-url").value = "https://youtu.be/12345678901";
    el("song-form").requestSubmit();
    await wait(() => !el("song-dialog").open);
    check(el("status").textContent.includes("may still complete") &&
      d.querySelectorAll("#tracks li").length === 4 && songRequests().length === 6,
      "A malformed response was not reconciled safely.");
    const removeRequests = () => requests.filter(r => r.path.endsWith("/playlists/other/tracks") && r.method === "DELETE");
    check(d.querySelectorAll(".edit-song").length === 4, "Saved tracks did not have edit buttons.");
    allowReplace = false;
    d.querySelectorAll(".edit-song")[2].click();
    check(el("edit-song-dialog").open && el("edit-song-url").value === "https://youtu.be/12345678901",
      "Edit did not open with the selected song URL.");
    el("edit-song-delete").click();
    check(el("edit-song-dialog").open && removeRequests().length === 0, "Cancelled song deletion sent a request.");
    el("edit-song-cancel").click();
    allowReplace = true;
    mode = "remove-delay";
    searchTracks("fetched");
    check(visibleTracks().length === 3, "Search did not filter added songs.");
    visibleTracks()[1].querySelector(".edit-song").click();
    el("edit-song-delete").click();
    await wait(() => typeof finishRemoveSong === "function");
    check([...d.querySelectorAll(".edit-song")].every(button => button.disabled) &&
      el("edit-song-save").disabled && el("edit-song-delete").disabled && el("edit-song-cancel").disabled,
      "Pending deletion did not disable removal buttons.");
    finishRemoveSong();
    await wait(() => el("status").textContent.includes("Song removed."));
    check(d.querySelectorAll("#tracks li").length === 3 && removeRequests().length === 1 &&
      el("playlist-title").textContent === "Other - (3 songs)" &&
      JSON.parse(removeRequests()[0].body).index === 2 && !localPaused && audio.src === playingSource &&
      requests.filter(r => r.path.endsWith("/queue")).length === queueRequests,
      "Removing a duplicate changed playback or removed the wrong entry.");
    check(visibleTracks().length === 2, "Search was not preserved after removing a song.");
    searchTracks("");
    initialPlaylists[0] = {...initialPlaylists[0], videos: [
      ...initialPlaylists[0].videos, {name: "Concurrent", link: "https://youtu.be/abcdefghijk"}
    ]};
    mode = "normal";
    d.querySelectorAll(".edit-song")[0].click();
    el("edit-song-delete").click();
    await wait(() => el("status").textContent.includes("playlist changed"));
    check(d.querySelectorAll("#tracks li").length === 4 && d.querySelector("#tracks").textContent.includes("Concurrent"),
      "Stale removal did not refresh the changed playlist.");
    mode = "remove-uncertain";
    d.querySelectorAll(".edit-song")[0].click();
    el("edit-song-delete").click();
    await wait(() => el("status").textContent.includes("Removing the song may still complete"));
    check(d.querySelectorAll("#tracks li").length === 3 && removeRequests().length === 3,
      "Uncertain removal was retried or not reconciled.");
    const replaceRequests = () => requests.filter(r => r.path.endsWith("/playlists/other/tracks") && r.method === "PATCH");
    searchTracks("fetched");
    visibleTracks()[1].querySelector(".edit-song").click();
    check(el("edit-song-name").textContent === "Fetched title", "Edit dialog did not identify the selected song.");
    mode = "song-invalid";
    el("edit-song-url").value = "https://evil.example/12345678901";
    el("edit-song-form").requestSubmit();
    await wait(() => !el("edit-song-error").hidden);
    check(el("edit-song-error").textContent.includes("valid HTTPS YouTube"), "Invalid replacement URL was not reported.");
    mode = "song-title-failed";
    el("edit-song-url").value = "https://youtu.be/zyxwvutsrqp";
    el("edit-song-form").requestSubmit();
    await wait(() => !el("edit-song-error").hidden);
    check(el("edit-song-error").textContent.includes("title"), "Replacement title failure was not reported.");
    mode = "replace-delay";
    el("edit-song-form").requestSubmit();
    await wait(() => typeof finishReplaceSong === "function");
    const editEscape = new w.Event("cancel", {cancelable: true});
    el("edit-song-dialog").dispatchEvent(editEscape);
    check(el("edit-song-save").disabled && el("edit-song-delete").disabled && el("edit-song-cancel").disabled &&
      editEscape.defaultPrevented, "Pending replacement allowed cancellation or a duplicate request.");
    finishReplaceSong();
    await wait(() => !el("edit-song-dialog").open);
    check(el("status").textContent.includes("Song updated") && visibleTracks().length === 1 &&
      d.querySelectorAll(".track-button")[1].textContent === "Replacement title" &&
      JSON.parse(replaceRequests()[2].body).index === 1 &&
      !localPaused && audio.src === playingSource && requests.filter(r => r.path.endsWith("/queue")).length === queueRequests,
      "Replacing a filtered duplicate changed playback or the wrong song.");
    searchTracks("");
    d.querySelectorAll(".edit-song")[0].click();
    initialPlaylists[0] = {...initialPlaylists[0], videos: [...initialPlaylists[0].videos,
      {name: "Another", link: "https://youtu.be/abcdefghijk"}]};
    mode = "normal";
    el("edit-song-url").value = "https://youtu.be/zyxwvutsrqp";
    el("edit-song-form").requestSubmit();
    await wait(() => el("status").textContent.includes("playlist changed"));
    check(!el("edit-song-dialog").open && d.querySelectorAll("#tracks li").length === 4,
      "A stale replacement did not refresh the playlist.");
    d.querySelectorAll(".edit-song")[0].click();
    mode = "replace-uncertain";
    el("edit-song-url").value = "https://youtu.be/zyxwvutsrqp";
    el("edit-song-form").requestSubmit();
    await wait(() => el("status").textContent.includes("Updating the song may still complete"));
    check(!el("edit-song-dialog").open && d.querySelectorAll(".track-button")[0].textContent === "Replacement title" &&
      replaceRequests().length === 5, "An uncertain replacement was retried or not reconciled.");
    d.querySelectorAll(".edit-song")[0].click();
    mode = "replace-malformed";
    el("edit-song-url").value = "https://youtu.be/12345678901";
    el("edit-song-form").requestSubmit();
    await wait(() => !el("edit-song-dialog").open);
    check(el("status").textContent.includes("Updating the song may still complete") && replaceRequests().length === 6,
      "A malformed replacement response was not reconciled.");
    d.querySelectorAll(".edit-song")[0].click();
    mode = "replace-delay";
    finishReplaceSong = null;
    el("edit-song-url").value = "https://youtu.be/zyxwvutsrqp";
    el("edit-song-form").requestSubmit();
    await wait(() => typeof finishReplaceSong === "function");
    el("signout").click();
    check(!el("edit-song-dialog").open && el("status").textContent.includes("playlist change may have completed"),
      "Signing out during replacement did not close the dialog and warn of an uncertain outcome.");
    finishReplaceSong();
    await new Promise(resolve => setTimeout(resolve, 20));
    check(!el("login-panel").hidden && el("status").textContent.includes("playlist change may have completed"),
      "A late replacement response changed the signed-out state.");
    result.textContent = "PASS: playlist and song management, settings, visualizer, login, queues, retry/skip, cancellation, and Cast confirmation.";
  } catch (error) {
    result.textContent = "FAIL: " + error.message;
  } finally {
    w.Image = originalImage;
    w.Storage.prototype.setItem = originalSetItem;
    w.setTimeout = originalSetTimeout;
    if (previousServerUrl === null) localStorage.removeItem(serverUrlKey);
    else localStorage.setItem(serverUrlKey, previousServerUrl);
    if (previousUsername === null) localStorage.removeItem(usernameKey);
    else localStorage.setItem(usernameKey, previousUsername);
    if (previousAutoShuffle === null) localStorage.removeItem(autoShuffleKey);
    else localStorage.setItem(autoShuffleKey, previousAutoShuffle);
    if (previousVisualizer === null) localStorage.removeItem(visualizerKey);
    else localStorage.setItem(visualizerKey, previousVisualizer);
  }
});
</script>
</body>
</html>
